# ============================================================================
# ЛОКАЛЬНАЯ РАЗРАБОТКА БЕЗ CADDY.
#
# Docker Compose автоматически мёржит этот файл с docker-compose.yml при
# команде `docker compose up` (локальный запуск). Здесь мы заменяем фронтенд
# с Caddy на Vite dev server — без TLS, без ACME, с hot-reload.
#
# ПРОДАКШЕН (с Caddy) запускается командой `make prod`, которая использует
# ТОЛЬКО docker-compose.yml и игнорирует этот файл.
# ============================================================================

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        environment:
            # Vite проксирует /api/* на бекенд по его docker-network hostname.
            VITE_API_PROXY_TARGET: http://backend:8000
        ports: !override
            - "5173:5173"
        volumes: !override
            # Hot-reload: монтируем исходники, чтобы изменения подхватывались
            # без пересборки образа. node_modules остаётся внутри образа.
            - ./frontend/src:/app/src
            - ./frontend/index.html:/app/index.html
            - ./frontend/vite.config.ts:/app/vite.config.ts
