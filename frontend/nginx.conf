# Nginx раздаёт собранный SPA и проксирует API на FastAPI-бэкенд.
# Все запросы на /api/* идут в сервис backend (см. docker-compose).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — любые маршруты отдаются в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на FastAPI (стрип /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэширование статики
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
